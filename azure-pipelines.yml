
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - script: |
      dotnet restore ./WebApplication2.Tests/WebApplication2.Tests.csproj
    displayName: 'Restore NuGet dependencies'

  - script: |
      dotnet build ./WebApplication2.Tests/WebApplication2.Tests.csproj --configuration Release --no-restore
    displayName: 'Build application and tests'

  - script: |
      dotnet test ./WebApplication2.Tests/WebApplication2.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
    displayName: 'Run xUnit tests'
