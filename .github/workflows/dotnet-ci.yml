
name: NHS Cardiff - .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and run xUnit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./WebApplication2.Tests/WebApplication2.Tests.csproj

      - name: Build application and tests
        run: dotnet build ./WebApplication2.Tests/WebApplication2.Tests.csproj --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test ./WebApplication2.Tests/WebApplication2.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
